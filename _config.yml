# Feature List                            Edit, add or remove features to be presented.
features                                  :
  - title                                 : Object Erase
    description                           : Remove unwanted objects from your photos. Simply mark the areas you want to remove and we'll seamlessly blend the background.
    fontawesome_icon_name                 : eraser

  - title                                 : Magic Edit
    description                           : Transform your photos with AI-powered edits. Add or change anything in your images with simple text instructions.
    fontawesome_icon_name                 : wand-magic-sparkles

  - title                                 : Photo Enhance
    description                           : Improve your photos by removing pixelation, enhancing details, and restoring clarity while maintaining a natural look.
    fontawesome_icon_name                 : image

  - title                                 : Black & White Restore
    description                           : Bring your black and white photos to life with accurate, period-appropriate colorization while preserving the original character.
    fontawesome_icon_name                 : palette

  - title                                 : Old Photo Restore
    description                           : Restore your vintage photos by repairing damage, enhancing details, and preserving the authentic look of the original.
    fontawesome_icon_name                 : history

  - title                                 : Text Restore
    description                           : Fix blurry or damaged text in your images. We'll restore text clarity while maintaining the original style and layout.
    fontawesome_icon_name                 : font

  - title                                 : Upscale Photo
    description                           : Increase the resolution of your photos by 2x while retaining clarity and detail, perfect for printing or high-resolution displays.
    fontawesome_icon_name                 : expand-arrows-alt

  - title                                 : Unblur Photo
    description                           : Transform blurry photos into sharp, clear images while maintaining the authentic look and feel of the original.
    fontawesome_icon_name                 : camera

  - title                                 : Resume Photo
    description                           : Create a professional headshot perfect for resumes and LinkedIn profiles, enhancing your image with subtle retouching and background adjustments.
    fontawesome_icon_name                 : user-tie

  # - title                                 : Cartoonify
  #   description                           : Transform your photos into various artistic styles including classic cartoon, anime, watercolor, and more.
  #   fontawesome_icon_name                 : paint-brush

  # - title                                 : Pixelate
  #   description                           : Convert your photos into pixel art masterpieces, perfect for retro-style graphics and creative projects.
  #   fontawesome_icon_name                 : th

  - title                                 : YouTube Thumbnail
    description                           : Create eye-catching YouTube thumbnails that stand out and attract more viewers to your content.
    fontawesome_icon_name                 : youtube

  - title                                 : Advertisement
    description                           : Transform your product photos into professional-looking advertisements with creative compositions.
    fontawesome_icon_name                 : ad

  - title                                 : Blister Pack
    description                           : Create nostalgic 90s-style action figure packages featuring your subject with custom accessories.
    fontawesome_icon_name                 : box

